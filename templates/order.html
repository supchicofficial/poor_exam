{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список заказов</title>
</head>
<body>
    <ul>
        <li><a href="{% url 'book_list' %}">Books</a></li>
        <li><a href="{% url 'author_list' %}">Authors</a></li>
        <li><a href="{% url 'order_list' %}">Orders</a></li>
    </ul>
    <h1>Список заказов</h1>
    <ul>
        {% for order in orders %}
            <li>
                {{ order.full_name }} -
                {{ order.number_phone }} -
                {{ order.book.title }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
